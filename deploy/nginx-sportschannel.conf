# SportsChannel -- static file serving, no domain yet (IP:port access).
# Target: Rocky Linux 9 / RHEL-family, which uses conf.d/ rather than the
# Debian-style sites-available/sites-enabled layout. Install: copy to
# /etc/nginx/conf.d/sportschannel.conf (auto-included, no separate "enable"
# step), then `nginx -t && systemctl reload nginx`. See deploy/DEPLOY.md
# step 7 for the SELinux/firewalld steps also required on this distro.
#
# Root points at the repo root (not web/) since web/index.html loads
# ../data/... and ../media/... via relative paths -- same layout as the
# local dev server (python -m http.server rooted one level up from web/).

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /opt/sportschannel;

    # Convenience: http://<ip>:8080/ -> the actual app page.
    location = / {
        return 302 /web/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Data/media files change frequently (daily refresh) or are fetched with
    # cache: "no-store" by app.js already -- keep nginx from adding its own
    # caching on top and masking a refresh.
    location /data/ {
        add_header Cache-Control "no-store";
    }

    location /web/ {
        add_header Cache-Control "no-cache";
    }

    # Logos/fonts/music don't change often -- fine to let the browser cache
    # them normally (nginx's default behavior with no extra header here).
}
